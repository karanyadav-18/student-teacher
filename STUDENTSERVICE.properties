spring.application.name=STUDENTSERVICE
server.port=8080
spring.datasource.url = jdbc:mysql://10.1.6.16:3306/trainingdb
spring.datasource.username = gaming
spring.datasource.password = ${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.jpa.show-sql=true


eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
spring.cloud.openfeign.circuitbreaker.enabled=true
server.error.include-message=always

# Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.teacherService.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.teacherService.slidingWindowSize=4
resilience4j.circuitbreaker.instances.teacherService.minimumNumberOfCalls=4
resilience4j.circuitbreaker.instances.teacherService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.teacherService.waitDurationInOpenState=10s
resilience4j.circuitbreaker.instances.teacherService.permittedNumberOfCallsInHalfOpenState=2

logging.level.io.github.resilience4j.circuitbreaker=DEBUG
logging.level.org.springframework.cloud.openfeign=DEBUG


# OpenFeign Timeout Configuration
spring.cloud.openfeign.client.config.default.connectTimeout=2000
spring.cloud.openfeign.client.config.default.readTimeout=3000

# Circuit Breaker TimeLimiter
resilience4j.timelimiter.instances.TEACHERSERVICE_testSlowResponse.timeoutDuration=3s
resilience4j.timelimiter.instances.TEACHERSERVICE_testSlowResponse.cancelRunningFuture=true

spring.config.import=configserver:http://localhost:8888


